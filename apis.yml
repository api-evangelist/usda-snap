    type: OpenAPI
  description: >-
    Public, anonymous, read-only Esri ArcGIS Feature Service exposing location
    records for every currently authorized SNAP retailer nationwide - store
    name, street address, city, state, zip/zip4, county, store type (e.g.
    Convenience Store, Grocery Store, Supermarket, Super Store, Farmers and
    Markets, Restaurant Meals Program, Specialty Store, Other), latitude and
    longitude, and Healthy Incentive Program / grantee participation.
    Supports SQL-style `where` filtering, field selection, spatial queries,
    sorting, distinct values, statistics, and offset-based pagination
    (maxRecordCount 1,000 rows per request) in JSON, GeoJSON, or PBF. This is
    the same live data source (ArcGIS item 8b260f9a10b0459aa441ad8588c2251c)
    embedded in FNA's own public retailer locator web tool.
