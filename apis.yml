name: USDA SNAP Retailer Locator
kind: government
description: >-
  The USDA Food and Nutrition Administration (FNA) - renamed from the Food and
  Nutrition Service (FNS) on June 1, 2026 - publishes an open, public geospatial
  API for the Supplemental Nutrition Assistance Program (SNAP) Retailer
  Locator. The data is hosted as an Esri ArcGIS Feature Service
  (snap_retailer_location_data) rather than a bespoke fns.usda.gov or
  api.fns.usda.gov endpoint, and is embedded directly in the public retailer
  locator tool at fna.usda.gov/snap/retailer-locator. It exposes point-in-time
  location records - name, address, city, state, zip, county, store type,
  latitude/longitude, and Healthy Incentive Program participation - for every
  currently authorized SNAP retailer nationwide (roughly a quarter million
  records as of the review date), queryable anonymously over REST with no API
  key, in JSON, GeoJSON, or PBF, with CSV/Shapefile/KML export also available
  through the ArcGIS Hub item page. Data is refreshed on a recurring basis by
  FNA; the service is read-only (Query only - no write capabilities).
