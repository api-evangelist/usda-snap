    type: Website
    note: Public retailer locator tool; links directly to the ArcGIS Hub explorer for dataset item 8b260f9a10b0459aa441ad8588c2251c, confirming this is the data source behind the tool. Also carries the FNS->FNA rename notice (effective 2026-06-01).
  - url: https://services1.arcgis.com/RLQu0rK7h4kbsBq5/arcgis/rest/services/snap_retailer_location_data/FeatureServer
    type: APIReference
    note: "Live service root, queried directly: capabilities='Query', maxRecordCount=1000, layers=[{id:0,name:snap_retailer_location_data}]."
  - url: https://services1.arcgis.com/RLQu0rK7h4kbsBq5/arcgis/rest/services/snap_retailer_location_data/FeatureServer/0
    type: APIReference
    note: "Live layer metadata, queried directly: geometryType=esriGeometryPoint, supportedQueryFormats=JSON,geoJSON,PBF, and the full field list (Record_ID, Store_Name, Store_Street_Address, Additonal_Address, City, State, Zip_Code, Zip4, County, Store_Type, Latitude, Longitude, Incentive_Program, Grantee_Name, ObjectId)."
  - url: https://services1.arcgis.com/RLQu0rK7h4kbsBq5/arcgis/rest/services/snap_retailer_location_data/FeatureServer/0/query
    type: APIReference
    note: "Live query endpoint, queried directly: where=1=1&returnCountOnly=true returned count=254048; where=State='DC' returned real retailer records (e.g. '24 Hours Tobacco & Grocery 1', 3728 Minnesota Ave NE, Washington DC 20019, Convenience Store)."
  - url: https://www.arcgis.com/home/item.html?id=8b260f9a10b0459aa441ad8588c2251c
    type: Documentation
    note: ArcGIS Online item page for the dataset, owned by FNS_SNAP_RPMD, titled SNAP_Retailer_Location_data.
  - url: https://usda-snap-retailers-usda-fns.hub.arcgis.com/datasets/USDA-FNS::snap-retailer-location-data/
    type: Documentation
    note: ArcGIS Hub dataset landing page (USDA-FNS organization) offering CSV/KML/Zip/GeoJSON/GeoTIFF/PNG download alongside GeoServices/WMS/WFS API links.
  - url: https://catalog.data.gov/dataset/snap-retail-locator
    type: Documentation
    note: data.gov catalog listing for the SNAP Retail Locator, linking to the public-facing tool.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. The confirmed public API is a
    read-only, anonymous, request/response REST interface (Esri ArcGIS
    Feature Service) with no server-push transport to model in an AsyncAPI
    document.
